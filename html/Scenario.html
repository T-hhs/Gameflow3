<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startscenarios</title>
    <link rel="stylesheet" href="/css/scenario.css">
</head>
<body>
    <header>
        <h1>Selecteer Scenario</h1>
        <p>Kies voor elk team een scenario. Je kunt het scenario per team instellen en de details rechts bekijken</p>
    </header>

    <aside>
        <section class="info">
            <article>

            </article>
        </section>
    </aside>
    
    <main>
        <section class="teams">
            <div class="teamHeader">
                <p><b>Team</b></p>
                <p><b>Scenario</b></p>
            </div>
            

            <article class="team">
                <p><b>Team 1</b></p>

                <select name="team" id="team">
                    <option value="1">Scenario 1</option>
                    <option value="2">Scenario 2</option>
                    <option value="3">Scenario 3</option>
                    <option value="4">Scenario 4</option>
                </select>
            </article>
            
        </section>
    </main>
    

    
</body>
</html>
