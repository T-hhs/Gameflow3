<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarktmanager Simulator</title>
    <link rel="stylesheet" href="../css/mainscreen.css">
    <script src="../js/mainscreen.js" defer></script>
</head>

<body>
    <header class="top-bar">
        <button class="favorite-button" type="button" aria-label="Favorieten">
            <span aria-hidden="true">☆</span>
        </button>
        <nav class="account-actions" aria-label="Account">
            <button class="account-button" type="button">Registreren</button>
            <button class="account-button" type="button">Inloggen</button>
        </nav>
    </header>

    <main class="home">
        <section class="hero" aria-labelledby="page-title">
            <h1 id="page-title" class="title-card">Supermarktmanager Simulator</h1>
            <h2>Run jouw eigen supermarkt!</h2>
            <p>Beheer je voorraad, bepaal je prijzen en maak slimme keuzes om de beste supermarktmanager te worden</p>
            <button class="join-button" id="create-game" type="button">Deelnemen met groepscode</button>
        </section>
    </main>
</body>
</html>
