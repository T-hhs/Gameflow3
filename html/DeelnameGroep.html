<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deelname Groep</title>
    <link rel="stylesheet" href="../css/DeelnameGroep.css" >
</head>

<body>
    <header>
        <h1>Deelnemen aan een groep</h1>
    </header>
    <main>
        <div class="inputs">
            <form class="formulier" id = "groep-definitie" novalidate>
            <div class= "velden">
            <label for="teamnaam"><b>Teamnaam:</b></label>
            <input id="teamnaam" class="veld" type="text" required aria-describedby="teamnaam-error" aria-invalid="false">
            <br>
            <span id="teamnaam-error" role="alert"></span>
            <br>
            <label for="groepscode"><b>Groepscode:</b></label>
            <input id="groepscode" class ="veld" type="text" required aria-describedby="groepscode-error" aria-invalid="false">
            <br>
            <span id="groepscode-error" role="alert"></span>
            <br>               
            </div>
            <button type="submit"><b>Join game</b></button> 
            </form>
            <script src="../js/DeelnameGroep.js"></script>
        </div>
    </main>
</body>

</html>
