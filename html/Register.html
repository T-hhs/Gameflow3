<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren | Supermarktmanager Simulator</title>
    <link rel="stylesheet" href="../css/Register.css">
    <script src="../js/Register.js" defer></script>
</head>

<body>
    <main class="auth-shell">
        <a class="back-link" href="MainScreen.html">Terug naar start</a>

        <section class="auth-card" aria-labelledby="page-title">
            <h1 id="page-title">Account aanmaken</h1>
            <p class="intro">Vul je gegevens in om te beginnen.</p>

            <form id="register-form" method="post">
                <div class="form-field">
                    <label for="naam">Naam</label>
                    <input type="text" id="naam" name="naam" autocomplete="name" required>
                    <span class="field-error" id="naam-fout" aria-live="polite"></span>
                </div>

                <div class="form-field">
                    <label for="email">E-mailadres</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <span class="field-error" id="email-fout" aria-live="polite"></span>
                </div>

                <div class="form-field">
                    <label for="wachtwoord">Wachtwoord</label>
                    <input type="password" id="wachtwoord" name="wachtwoord" autocomplete="new-password" required>
                    <span class="field-error" id="wachtwoord-fout" aria-live="polite"></span>
                </div>

                <div class="form-field">
                    <label for="herhaal-wachtwoord">Herhaal wachtwoord</label>
                    <input type="password" id="herhaal-wachtwoord" name="herhaal-wachtwoord" autocomplete="new-password" required>
                    <span class="field-error" id="herhaalwachtwoord-fout" aria-live="polite"></span>
                </div>

                <button class="submit-button" type="submit">Registreren</button>
                <p class="form-feedback" id="feedback" aria-live="polite" role="status"></p>
            </form>

            <p class="switch-link">Heb je al een account? <a href="LogIn.html">Log in</a></p>
        </section>
    </main>
</body>
</html>
