<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren</title>
    <link rel="stylesheet" href="/css/Register.css">
    <script src="/js/Register.js" defer></script>
</head>

<body>
    <main class="register">
        <h1>Registratie</h1>
        <p>Vul hier je gegevens in om een account te maken.</p>
        <form id="register-form">
            <div>
                <label for="naam">Naam:</label>
                <input type="text" id="naam" name="naam">
                <span id="naam-fout" aria-live="polite"></span>
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
                <span id="email-fout" aria-live="polite"></span>
            </div>

            <div>
                <label for="wachtwoord">Wachtwoord:</label>
                <input type="wachtwoord" id="wachtwoord" name="wachtwoord">
                <span id="wachtwoord-fout" aria-live="polite"></span>
            </div>

            <div>
                <label for="wachtwoord">Herhaal wachtwoord:</label>
                <input type="wachtwoord" id="wachtwoord" name="wachtwoord">
                <span id="wachtwoord-fout" aria-live="polite"></span>
            </div>

            <button type="submit">Registreer</button>
            <p>Heb je al een account?</p>
            <li><a href="LogIn.html"> Log in</a></li>
        </form>
    </main>
</body>
</html>
